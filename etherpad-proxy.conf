# Reverse proxy HTTPS devant Etherpad.
# Nécessaire car l'image Docker officielle d'Etherpad ne termine pas le HTTPS
# elle-même ; c'est la solution recommandée par la documentation officielle :
# https://github.com/ether/etherpad-lite/wiki/Putting-Etherpad-behind-a-reverse-Proxy-%28HTTPS-SSL%29
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        proxy_pass http://etherpad:9001;
        proxy_http_version 1.1;

        # Etherpad utilise WebSocket (Socket.io) en interne pour la synchronisation
        # temps réel de l'édition : ces deux en-têtes sont indispensables, sans
        # eux l'éditeur charge mais l'édition collaborative ne fonctionne pas.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
